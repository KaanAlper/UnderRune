<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>UnderRune</title>
    <script>
      // GitHub Pages paths are case-sensitive; this page makes them not: /UnderRune/PLAY opens /UnderRune/play/.
      // tools/build-pages.mjs writes the site's pages in place of the list below.
      (function () {
        var pages = ["/","/index.html","/play/","/play/index.html"];
        var loc = window.location, base = '/UnderRune', want = loc.pathname.toLowerCase();
        var match = pages.filter(function (p) { var url = (base + p).toLowerCase(); return url === want || url === want + '/'; })[0];
        if (match !== undefined && base + match !== loc.pathname) { window.location.replace(base + match + loc.search + loc.hash); return; }
        document.addEventListener('DOMContentLoaded', function () { document.body.hidden = false; });
      })();
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #fff; font: 16px/1.5 monospace; }
      a { color: #ff0; }
    </style>
  </head>
  <body hidden>
    <p>Nothing here. <a href="/UnderRune/">Back to UnderRune</a></p>
  </body>
</html>
